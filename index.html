<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1226">
<title>Karthik Vetrivel — The Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<header>
  <h1>◆ <span id="title-name">KARTHIK</span>'S LAB</h1>
  <nav>
    <button id="sound-btn" aria-pressed="false" aria-label="Toggle sound">♪ OFF</button>
  </nav>
</header>

<div id="console" tabindex="0" role="application"
     aria-label="Pixel-art lab. Move with arrow keys or WASD, press Z or Enter to interact.">
  <div id="screen">
    <canvas id="game" width="208" height="224"></canvas>

    <div id="hint-move" class="hint" hidden aria-hidden="true">WALK: ↑↓←→ / WASD</div>
    <div id="hint-act" class="hint" hidden aria-hidden="true">PRESS ENTER TO EXAMINE</div>

    <div id="dlg" hidden>
      <div id="dlg-text" aria-live="polite"></div>
      <div id="dlg-more" hidden>▼</div>
    </div>

    <div id="menu" hidden role="menu"></div>

    <div id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-co">
      <div id="panel-card">
        <div id="panel-head"><span id="panel-ballname"></span><span id="panel-level"></span></div>
        <div id="panel-body">
          <div id="panel-art">
            <canvas id="icon-sprite" width="16" height="16"></canvas>
            <canvas id="ball-sprite" width="10" height="10"></canvas>
          </div>
          <div id="panel-info">
            <div class="co" id="panel-co"></div>
            <div class="role" id="panel-role"></div>
            <div class="dates" id="panel-dates"></div>
            <span class="type-chip" id="panel-type"></span>
          </div>
        </div>
        <p id="panel-blurb"></p>
        <ul id="panel-acc"></ul>
        <button id="panel-close">CLOSE ▶</button>
      </div>
    </div>
  </div>
</div>

<footer>
  <p><kbd>↑↓←→</kbd>/<kbd>WASD</kbd> WALK &nbsp; <kbd>Z</kbd>/<kbd>ENTER</kbd> TALK·EXAMINE &nbsp; <kbd>X</kbd>/<kbd>ESC</kbd> BACK</p>
</footer>

<div id="controls" aria-hidden="true">
  <button class="pad-btn" id="btn-up">▲</button>
  <button class="pad-btn" id="btn-down">▼</button>
  <button class="pad-btn" id="btn-left">◀</button>
  <button class="pad-btn" id="btn-right">▶</button>
  <button class="pad-btn" id="btn-a">A</button>
  <button class="pad-btn" id="btn-b">B</button>
</div>

<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
